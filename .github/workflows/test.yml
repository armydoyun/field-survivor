name: test

# 모든 브랜치의 push와 PR마다 실행한다. Actions 탭의 "Run workflow" 버튼으로 직접 돌릴 수도 있다.
on:
  push:
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# 러너는 ubuntu-24.04로 고정한다. Playwright 1.48의 install --with-deps가 지원하는 배포판은 24.04까지다.
# Playwright를 올릴 때 함께 바꾼다.
jobs:
  # 정적 검사. 테스트와 따로 돌려서, lint가 실패해도 테스트 결과는 그대로 볼 수 있다.
  # ESLint 경고와 Prettier 어긋남(tools/) 모두 실패로 친다.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install lint tools
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting (Prettier, tools/)
        run: npm run format:check

  # 두 묶음을 따로 돌린다. 어느 묶음이 실패했는지 작업 이름에서 바로 보이고, 하나가 실패해도 나머지는 끝까지 돈다.
  #   node     npm test — 모의 DOM/Canvas로 도는 node:test 전체(release.test.js 포함)
  #   browser  npm run test:build — 배포본을 빌드해 실제 Chromium에서 file://로 열고 새 게임을 진행해 봄
  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [node, browser]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install npm tools
        run: npm ci --no-audit --no-fund

      - name: Run node tests
        if: matrix.suite == 'node'
        run: npm test

      # Chromium 내려받기는 Playwright 버전(lock 파일)이 같으면 캐시에서 꺼낸다.
      # 시스템 라이브러리(install-deps)는 캐시할 수 없으므로 매번 설치한다.
      - name: Cache Playwright browsers
        if: matrix.suite == 'browser'
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: matrix.suite == 'browser'
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run browser build check
        if: matrix.suite == 'browser'
        run: npm run test:build

      - name: Preserve failure screenshot
        if: failure() && matrix.suite == 'browser'
        uses: actions/upload-artifact@v6
        with:
          name: field-survivor-browser-failure-${{ github.sha }}
          path: test-results/build/
          if-no-files-found: ignore
          retention-days: 7

  # lint와 두 묶음이 모두 통과하면 한 파일짜리 배포본을 만들어 실행 페이지의 Artifacts에 올린다.
  # 이름에 커밋 SHA를 붙여 어느 소스에서 만든 파일인지 알 수 있게 한다.
  build:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install build tools
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Build single-file deploy
        run: npm run build

      - uses: actions/upload-artifact@v6
        with:
          name: field-survivor-deploy-${{ github.sha }}
          path: deploy/index.html
          if-no-files-found: error
